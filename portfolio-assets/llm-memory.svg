<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Fondations LLM — mémoire et sortie structurée</title>
  <desc id="desc">Illustration d'une fenetre de contexte conversationnel et d'une reponse validee par schema.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#103c2d"/><stop offset="1" stop-color="#071f18"/></linearGradient></defs>
  <rect width="960" height="480" rx="22" fill="url(#bg)"/>
  <text x="54" y="58" fill="#d9b26a" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">ILLUSTRATION · CONTEXTE &amp; SORTIE STRUCTURÉE</text>
  <text x="85" y="120" fill="#e9efe9" font-family="Arial,sans-serif" font-size="21" font-weight="700">FENÊTRE DE CONTEXTE</text>
  <rect x="84" y="147" width="430" height="214" rx="18" fill="#0b291f" stroke="#60786b" stroke-width="2"/>
