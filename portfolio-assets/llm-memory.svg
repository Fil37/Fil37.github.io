  </g>
  <path d="M379 341h94" stroke="#c8874a" stroke-width="5" stroke-dasharray="7 8"/><text x="426" y="385" text-anchor="middle" fill="#b9cbbf" font-family="Arial,sans-serif" font-size="13">fenêtre glissante</text>
  <path d="M548 252h82" stroke="#d9b26a" stroke-width="4"/><path d="m622 242 18 10-18 10" fill="none" stroke="#d9b26a" stroke-width="4"/>
  <text x="723" y="120" text-anchor="middle" fill="#e9efe9" font-family="Arial,sans-serif" font-size="21" font-weight="700">SORTIE VALIDÉE</text>
  <rect x="650" y="147" width="224" height="214" rx="18" fill="#f3f4ee"/>
  <text x="674" y="181" fill="#103c2d" font-family="Arial,sans-serif" font-size="15" font-weight="700">SCHÉMA PYDANTIC</text>
