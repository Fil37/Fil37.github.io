  <circle cx="847" cy="340" r="17" fill="#62c78b"/><path d="m839 340 6 6 11-13" fill="none" stroke="#103c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="430" text-anchor="middle" fill="#b9cbbf" font-family="Arial,sans-serif" font-size="15">LLAMA LOCAL · BUDGET DE TOKENS · VALIDATION</text>
